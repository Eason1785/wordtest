<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 預先連接到字體網，減少加載時間 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <!-- 連接css 檔案 -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/viewerjs/dist/viewer.css" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">


    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
</head>
<body>
    <div class="sticky top-0 px-6 py-6 bg-white shadow-lg">
        <!-- Here should be the top box -->
        <div class="container mx-auto flex justify-between items-center">
            <!-- it splits the box into two sides  -->
            <div class="flex-1 min-w-0 border-2 border-red-500" >
                <h2 class="text-3xl font-bold leading-8 text-gray-900 sm:truncate" id="character_name">
                  Here should be name 
                </h2>
            </div>
            <div class="flex mt-0 ml-4 border-2 border-green-500">
                <button type="button" id="rechoose_char"
                    class="inline-flex items-center px-4 py-2 rounded-md shadow-sm text-sm font-bold text-white bg-neutral-600 hover:bg-neutral-700 ">
                    重選角色
                </button>
            </div>
                
            </div>
        </div>
    </div>
    
</body>
<script>
    if(!window.localStorage.getItem('character')){
        window.location.href = 'character.html?' + Date.now()
    };
    $(() => {
        let character = JSON.parse(window.localStorage.getItem('character'));
        let name = character.name;
        $('#character_name').text(name);

        $('#rechoose_char').click(function () {

            window.localStorage.removeItem('character')

            // 跳轉回到選角頁面（帶上時間戳記防止快取）
            window.location.href = 'character.html?' + Date.now();});


    })

</script>
</html>
