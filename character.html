<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 預先連接到字體網，減少加載時間 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <!-- 連接css 檔案 -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/viewerjs/dist/viewer.css" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">


    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
</head>
<body>
    <div class="container mx-auto px-6 py-6">
        <div>
            <legend class="text-2xl font-bold text-red-900">月落洼角色</legend>

            <div class="mt-4 grid grid-cols-1 gap-y-6 sm:grid-cols-2 md:grid-cols-3 gap-x-4" id="characters">
            </div>
        </div>
    </div>

    <div id="confirm_box" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden ">
      <div class="bg-white rounded-lg p-6 w-full max-w-sm shadow-lg mx-6 space-y-4">
        <h3 id="confirm_message" class="text-lg font-bold mb4"></h3>
        <div class="flex justify-end space-x-3">
          <button id="confirm_ok" class="bg-green-400 rounded-lg px-4 py-2 cursor-pointer hover:bg-green-500">確認</button>
          <button id="confirm_cancel" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400 cursor-pointer">取消</button>
        </div>
      </div >
    </div>

    <script>
        const character =  {
            1:{name: '"养女"尔芙'},
            2:{name: '"养子"睿司'},
            3:{name: '"管家外甥"吾特'},
            4:{name: '"侄子"安梧'},
            5:{name: '"表外甥女"伍艾菲'}
    
    
    }
    const character_selecter = $("#characters")
    for (const[key , value] of Object.entries(character)){
        let id = key ;
        let name = value.name;
    character_selecter.append(`
      <label class="selecter bg-white border rounded-lg shadow-lg p-6 flex cursor-pointer focus:outline-none focus:ring-red-500 focus:ring-offset-2 focus:ring-2" character-id="${id}">
        <input type="radio" name="choose_character" class="sr-only">
        <div class="flex-1 flex ">
            <div class="flex flex-col">
                <span class="block text-xl font-bold text-gray-900 ml-3 mb-4">${name}</span>
                <img src="character-photo/${id}.jpeg" alt= "角色圖片">
            </div>
      </div>
        
        
        
        </label>`);


    };
    let selected_id = null ;
    let selectcharacter = function(id) {
        // prompt for password
        let character_name = character[id].name
        let character_detail = character[id]; 
        character.id = id;
        selected_id = id 

        $("#confirm_message").text(`你的角色為${character_name}`);
        $("#confirm_box").removeClass("hidden");
 }

    $(".selecter").click(function() {
        let id = $(this).attr("character-id");
        selectcharacter(id);
        return false;
        });
    $("#confirm_ok").click(function(){
      if(selected_id !== null){
        let selected_character = character[selected_id];
        window.localStorage.setItem("character" , JSON.stringify(selected_character));
        window.location.href = "bench.html?" + Date.now();
      }

      
    });
    $("#confirm_cancel").click(function(){
      $("#confirm_box").addClass("hidden");
      selected_id = null
     
    });
    </script>
    
</body>
</html>
